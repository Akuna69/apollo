name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Correct NDK Environment
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/2* | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Install gomobile & cargo-ndk
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cargo install cargo-ndk

      - name: Grant execute permission for scripts
        run: |
          chmod +x gradlew || true
          chmod +x tools/*sh || true
          chmod +x android/tools/*sh || true

      - name: Create required native lib directories
        run: |
          mkdir -p libwallet/libs/armv7-linux-androideabi/
          mkdir -p libwallet/libs/aarch64-linux-android/
          mkdir -p libwallet/libs/x86_64-linux-android/
          mkdir -p libwallet/libs/i686-linux-android/

      - name: Build Common & Dependencies
        run: ./gradlew :common:build -x test -x checkstyleMain -x checkstyleTest -x pmdMain -x pmdTest

      - name: Build APK with Gradle
        run: ./gradlew :android:apolloui:assembleDebug --stacktrace -x test -x checkstyleMain -x checkstyleTest -x pmdMain -x pmdTest

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meen-wallet-app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-error-log
          path: |
            **/build/reports/
            **/build/outputs/logs/
